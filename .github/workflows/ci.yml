name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  security:
    name: Security scan (pre-commit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pre-commit/action@v3.0.1
        env:
          # powershell-lint is a local-only convenience check (see
          # .pre-commit-config.yaml); it isn't required to gate merges.
          SKIP: powershell-lint

  gate:
    name: CI
    needs: [security]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required jobs succeeded
        run: |
          for result in "${{ needs.security.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed (got: $result)"
              exit 1
            fi
          done
